<!doctype html>
<html><head><meta charset="utf-8"><style>
:root { --bg:#1e1e1e; --bg2:#2a2a2a; --border:#3d3d3d; --text:#dcddde; --muted:#999; --accent:#8b6cf0; }
* { box-sizing: border-box; font-family: -apple-system, "PingFang SC", sans-serif; }
body { background: var(--bg); padding: 32px; display: flex; flex-direction: column; gap: 28px; }
.variant { color: var(--text); }
.vname { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; width: fit-content; }
.seg { display: inline-flex; background: #1a1a1a; border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: none; background: transparent; color: var(--muted); font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--accent); color: #fff; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hatch { border: 1px solid currentColor; border-radius: 2px; background: repeating-linear-gradient(-45deg, currentColor 0 1.5px, transparent 1.5px 3.5px); width: 9px; height: 9px; display: inline-block; }
.swatch { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: #1a1a1a; border: 1px solid var(--border); color: var(--text); }
/* V2: icon 派 */
.iconbtn { width: 26px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted); }
.iconbtn.on { background: var(--accent); color: #fff; }
.vlabel { font-size: 11px; color: var(--muted); margin-right: 2px; }
/* V3: Google Calendar 派 */
.gcal { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.gcal.on { color: var(--text); }
.gcal .box { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
.gcal.on .box { background: currentColor; }
.gcal.on .box::after { content: "✓"; color: var(--bg2); font-weight: 700; }
/* V4: 下划线 tab 派 */
.tabs { display: inline-flex; gap: 14px; }
.tabs button { border: none; background: none; color: var(--muted); font-size: 12.5px; padding: 4px 2px; border-bottom: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
</style></head><body>

<div class="variant"><div class="vname">V1 · 当前版（文字+色点/斜纹，胶囊分段）</div>
<div class="row">
  <span class="seg"><button class="on"><span class="dot" style="background:#4ec9b0"></span>记录</button><button><span class="hatch" style="color:#999"></span>计划</button></span>
  <span class="swatch"><span class="dot" style="background:#4ec9b0"></span>开发</span>
  <span class="swatch"><span class="dot" style="background:#e05d5d"></span>自媒体</span>
  <span class="swatch"><span class="dot" style="background:#e0a53d"></span>运动</span>
</div></div>

<div class="variant"><div class="vname">V2 · 图标派（画笔=笔图标，图层=眼睛图标，文字只留一层）</div>
<div class="row">
  <span class="vlabel">画笔</span>
  <span class="seg"><button class="on" title="画实际色块">🖊</button><button title="画计划块">✏️</button></span>
  <span class="swatch"><span class="dot" style="background:#4ec9b0"></span>开发</span>
  <span class="swatch"><span class="dot" style="background:#e05d5d"></span>自媒体</span>
  <span style="flex:1"></span>
  <span class="vlabel">显示</span>
  <span class="seg"><button class="iconbtn on" title="记录图层">👁</button><button class="iconbtn" title="计划图层">👁</button></span>
</div></div>

<div class="variant"><div class="vname">V3 · Google Calendar 派（图层=色块勾选；画笔=左侧小胶囊）</div>
<div class="row">
  <span class="seg"><button class="on">记录</button><button>计划</button></span>
  <span class="swatch"><span class="dot" style="background:#4ec9b0"></span>开发</span>
  <span style="flex:1"></span>
  <button class="gcal on"><span class="box" style="color:#4ec9b0"></span>记录</button>
  <button class="gcal on"><span class="box" style="color:#999"></span>计划</button>
</div></div>

<div class="variant"><div class="vname">V4 · 极简下划线 tab 派（最克制，文字最少）</div>
<div class="row">
  <span class="tabs"><button class="on"><span class="dot" style="background:#4ec9b0"></span>记录</button><button><span class="hatch" style="color:#999"></span>计划</button></span>
  <span class="swatch"><span class="dot" style="background:#4ec9b0"></span>开发</span>
  <span class="swatch"><span class="dot" style="background:#e05d5d"></span>自媒体</span>
</div></div>

</body></html>
